<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>训练卡 · 10-16 休息日</title>
<style>
  :root{
    --bg:#000000;
    --card:#17171a;
    --card2:#232328;
    --text:#ffffff;
    --muted:#8e8e93;
    --lime:#b9f73c;
    --lime-dim:rgba(185,247,60,.13);
    --pink:#ff4d67;
    --pink-dim:rgba(255,77,103,.12);
    --hair:rgba(255,255,255,.08);
    --r:26px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6;
  }
  .wrap{max-width:480px; margin:0 auto; padding:10px 14px 30px;}

  /* —— 绿色胶囊提醒 —— */
  .banner{
    margin:14px 0 4px; background:var(--lime-dim); border-radius:999px;
    padding:13px 18px; color:var(--lime); font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  .banner .dot{width:22px; height:22px; border-radius:50%; background:var(--lime);
    color:#0c1206; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:0 0 22px;}

  /* —— 大标题行 —— */
  .title-row{display:flex; align-items:baseline; justify-content:space-between; margin:24px 4px 14px;}
  .title-row h2{margin:0; font-size:29px; font-weight:800; letter-spacing:.3px;}
  .title-row .date{font-size:13px; color:var(--muted);}

  /* —— 指标双卡 —— */
  .metrics{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .metric{background:var(--card); border-radius:var(--r); padding:18px 18px 16px;}
  .metric .lab{font-size:13px; color:var(--muted); margin-bottom:8px;}
  .metric .val{font-size:33px; font-weight:800; letter-spacing:.3px; line-height:1.15;}
  .metric .val small{font-size:13px; font-weight:500; color:var(--muted); margin-left:6px;}
  .metric .val-sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .metric.lime .val{color:var(--lime);}
  .metric.wide{grid-column:1 / -1;}
  .metric .val-big2{font-size:21px; font-weight:800; line-height:1.35; color:var(--lime);}
  .bars{display:flex; align-items:flex-end; gap:6px; height:34px; margin-top:6px;}
  .bars i{flex:1; border-radius:3px; background:#2c2c31; min-height:7px;}
  .bars i.on{background:var(--lime);}
  .bars-lab{display:flex; gap:6px; margin-top:5px;}
  .bars-lab span{flex:1; text-align:center; font-size:11px; color:var(--muted);}
  .bars-lab span:last-child{color:var(--lime); font-weight:700;}

  /* —— 动作卡 —— */
  .ex{background:var(--card); border-radius:var(--r); padding:18px; margin-bottom:12px;}
  .ex-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .ex .kicker{font-size:13px; color:var(--muted);}
  .ex .idx{width:38px; height:38px; border-radius:50%; background:var(--card2); flex:0 0 38px;
    display:flex; align-items:center; justify-content:center; color:var(--lime); font-weight:800; font-size:15px;}
  .ex h3{margin:6px 0 2px; font-size:22px; font-weight:800; letter-spacing:.3px;}
  .ex .target{color:var(--lime); font-weight:700; font-size:15px;}
  .set{display:flex; align-items:center; gap:12px; padding:13px 2px; border-top:1px solid var(--hair); cursor:pointer; user-select:none;}
  .set input{appearance:none; -webkit-appearance:none; width:24px; height:24px; border-radius:9px;
    border:2px solid #3d3d44; background:transparent; margin:0; flex:0 0 24px; cursor:pointer; position:relative;}
  .set input:checked{background:var(--lime); border-color:var(--lime);}
  .set input:checked::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#0c1206; font-size:15px; font-weight:900;}
  .set .sname{font-size:15px; font-weight:600;}
  .set .w{margin-left:auto; color:var(--lime); font-weight:800; font-size:15px; white-space:nowrap;}
  .set.done{opacity:.42;}
  .set.done .sname{text-decoration:line-through;}

  /* —— 粉色提醒卡（明日预告） —— */
  .alert{background:var(--pink-dim); border-radius:var(--r); padding:18px; margin-bottom:12px;}
  .alert .lab{font-size:13px; color:var(--pink); font-weight:700; margin-bottom:8px;}
  .alert p{margin:0; font-size:14.5px; line-height:1.7; color:#f2d7dc;}
  .alert b{color:#fff;}

  .foot{text-align:center; color:var(--muted); font-size:12px; margin:20px 0 8px;}

</style>
</head>
<body>
<div class="wrap" id="top">

  <div class="banner" id="goal">
    <span class="dot">◉</span>
    <span>今日休息，好好恢复</span>
  </div>

  <div class="title-row">
    <h2>October 16, Friday</h2>
  </div>

  <div class="metrics" id="metrics">
    <div class="metric">
      <div class="lab">倒计时</div>
      <div class="val"><span id="dday">57</span><small>天</small></div>
      <div class="val-sub">12月12日</div>
    </div>
    <div class="metric lime">
      <div class="lab">今日恢复目标</div>
      <div class="val-big2">散步 30 分钟</div>
      <div class="val-sub">蛋白 105–145g · 23 点前睡觉</div>
    </div>
    <div class="metric wide">
      <div class="lab">近4次训练 · 动态消耗 kcal</div>
      <div class="bars" role="img" aria-label="近4次训练动态消耗：10月12日推260千卡，10月13日拉361千卡，10月14日休息散步56千卡，10月15日腿420千卡">
        <i style="height:62%" title="10-12 推 · 260kcal"></i><i style="height:86%" title="10-13 拉 · 361kcal"></i><i style="height:13%" title="10-14 休息散步 · 56kcal"></i><i class="on" style="height:100%" title="10-15 腿 · 420kcal"></i>
      </div>
      <div class="bars-lab"><span>12推</span><span>13拉</span><span>14休</span><span>15腿</span></div>
    </div>
  </div>

  <div class="alert">
    <div class="lab">明日预告 · 训练日</div>
    <p>🦵 <b>10 月 17 日（周六）· 推日（胸/肩）</b></p>
    <p>哑铃卧推 + HOIST 上斜卧推机 + 站姿侧平举（肩部先练侧束），平板收尾</p>
  </div>

  <div class="title-row" id="todos">
    <h2>今日待办</h2>
  </div>

  <div class="ex">
    <div class="ex-top">
      <div class="kicker">休息日 · 恢复为主</div>
      <div class="idx">✓</div>
    </div>
    <h3>今日待办</h3>
    <div class="target">恢复 + 蛋白 + 睡眠</div>
    <label class="set"><input type="checkbox"><span class="sname">散步或轻松活动</span><span class="w">20–30 分钟</span></label>
    <label class="set"><input type="checkbox"><span class="sname">平板支撑</span><span class="w">60 秒 × 2 组</span></label>
    <label class="set"><input type="checkbox"><span class="sname">蛋白吃够</span><span class="w">105–145g</span></label>
    <label class="set"><input type="checkbox"><span class="sname">23 点前睡觉</span><span class="w">今晚</span></label>
  </div>

  <div class="foot">阿呆健身教练 · 每天自动更新</div>

</div>

<script>
(function(){
  var KEY='tt-2026-10-16';
  var end=new Date(2026,11,12), now=new Date();
  var days=Math.max(0,Math.ceil((end-now)/864e5));
  document.getElementById('dday').textContent=days;
  var boxes=[].slice.call(document.querySelectorAll('.set input'));
  var total=boxes.length;
  var saved={};
  try{ saved=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
  function paint(){
    var done=0;
    boxes.forEach(function(b,i){
      var on=!!saved[i];
      b.checked=on;
      b.closest('.set').classList.toggle('done',on);
      if(on)done++;
    });
  }
  boxes.forEach(function(b,i){
    b.addEventListener('change',function(){
      saved[i]=b.checked;
      try{ localStorage.setItem(KEY,JSON.stringify(saved)); }catch(e){}
      paint();
    });
  });
  paint();
})();
</script>
</body>
</html>
